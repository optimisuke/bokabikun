<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bokabikun</title>

    <!-- Tailwind (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <style>
      .icon-press {
        transition: transform 120ms ease, opacity 120ms ease;
      }
      .icon-press:active {
        animation: icon-bounce 180ms ease;
        opacity: 0.75;
      }
      .icon-swap {
        position: relative;
        display: inline-block;
        width: 24px;
        height: 24px;
      }
      .icon-swap img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        transition: opacity 400ms ease;
      }
      .icon-swap .icon-active {
        opacity: 0;
      }
      .icon-swap.flash .icon-active {
        opacity: 1;
      }
      .icon-swap.flash .icon-base {
        opacity: 0;
      }
      @keyframes icon-bounce {
        0% {
          transform: scale(1);
        }
        40% {
          transform: scale(0.86);
        }
        70% {
          transform: scale(1.08);
        }
        100% {
          transform: scale(1);
        }
      }
      body.drag-mode {
        user-select: none;
        cursor: grabbing;
      }
      .dragging-item {
        opacity: 0.6;
        transform: scale(0.98);
      }
    </style>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-900">
    <header
      class="sticky top-0 z-10 border-b border-slate-200 bg-white/80 backdrop-blur"
    >
      <div
        class="mx-auto flex max-w-3xl items-center justify-between gap-3 px-4 py-3"
      >
        <div class="flex items-center gap-3">
          <img
            src="icon.svg"
            alt="Bokabikun"
            class="h-10 w-10 rounded-xl shadow-sm"
          />
          <div>
            <h1 class="text-lg font-semibold leading-tight">
              タスク管理 Bokabi-kun
            </h1>
            <p class="text-xs text-slate-500">ゆるく管理するタスクアプリ</p>
          </div>
        </div>

        <div class="flex items-center gap-2"></div>
      </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-6 pb-24">
      <div class="mb-4 flex items-center justify-center">
        <div
          class="inline-flex rounded-full bg-slate-100 p-1 text-xs font-medium"
        >
          <button
            type="button"
            data-tab="tasks"
            class="tab-btn rounded-full px-4 py-2 text-slate-700"
            aria-selected="true"
          >
            タスク
          </button>
          <button
            type="button"
            data-tab="themes"
            class="tab-btn rounded-full px-4 py-2 text-slate-700"
            aria-selected="false"
          >
            プロジェクト
          </button>
        </div>
      </div>

      <div id="tabViewport">
        <!-- Tasks Panel -->
        <section id="tasksPanel">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-700">一覧</h2>
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span id="countText">0件</span>
              <span
                class="inline-block h-1 w-1 rounded-full bg-slate-300"
              ></span>
              <span id="updatedText">—</span>
            </div>
          </div>

          <div
            id="emptyState"
            class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center"
          >
            <p class="text-sm font-medium text-slate-700">タスクなし</p>
            <p class="mt-1 text-xs text-slate-500">＋で追加</p>
          </div>

          <div id="list" class="grid gap-3"></div>
        </section>

        <!-- Themes Panel -->
        <section id="themesPanel" class="hidden">
          <div class="mb-3 flex items-center justify-between">
            <h2 class="text-sm font-semibold text-slate-700">プロジェクト</h2>
            <div class="flex items-center gap-2 text-xs text-slate-500">
              <span id="themeCountText">0件</span>
            </div>
          </div>

          <div
            id="themeEmptyState"
            class="hidden rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center"
          >
            <p class="text-sm font-medium text-slate-700">プロジェクトなし</p>
            <p class="mt-1 text-xs text-slate-500">＋で追加</p>
          </div>

          <div id="themeList" class="grid gap-4"></div>
          <div class="mt-5">
            <button
              id="btnAddThemeInline"
              class="w-full rounded-2xl bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-3 text-sm font-medium text-white shadow-lg shadow-emerald-500/20 hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
              aria-label="プロジェクトを追加"
            >
              ＋ プロジェクトを追加
            </button>
          </div>
        </section>
      </div>
    </main>
    <button
      id="btnAddFab"
      class="fixed bottom-4 right-4 z-30 inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-3 text-sm font-medium text-white shadow-lg shadow-emerald-500/20 hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
      aria-label="タスクを追加"
    >
      ＋ 追加
    </button>

    <div
      id="toast"
      class="fixed bottom-20 right-4 z-30 hidden max-w-xs items-center gap-3 rounded-2xl bg-white px-4 py-3 text-sm text-slate-800 shadow-lg ring-1 ring-slate-200 flex"
    >
      <span id="toastMessage" class="font-medium"></span>
      <button
        id="btnUndo"
        class="ml-auto rounded-xl border border-slate-200 bg-white px-3 py-1 text-xs font-medium text-slate-600 hover:bg-slate-50"
      >
        取り消す
      </button>
    </div>

    <!-- Task Modal -->
    <div id="modalBackdrop" class="fixed inset-0 z-20 hidden bg-black/40 p-4">
      <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-2xl bg-white shadow-xl ring-1 ring-slate-200">
          <div
            class="flex items-center justify-between border-b border-slate-200 px-4 py-3"
          >
            <h3 id="modalTitle" class="text-sm font-semibold text-slate-800">
              タスク
            </h3>
            <button
              id="btnCloseModal"
              class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:bg-slate-100"
            >
              ✕
            </button>
          </div>

          <form id="taskForm" class="space-y-4 p-4">
            <input type="hidden" id="taskId" />

            <div>
              <label class="text-xs font-medium text-slate-600">名前</label>
              <input
                id="taskName"
                type="text"
                class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                placeholder="例）防カビくん / 浄水器フィルター"
                required
                maxlength="40"
              />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-medium text-slate-600"
                  >周期（日）</label
                >
                <input
                  id="taskInterval"
                  type="number"
                  min="1"
                  max="999"
                  class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                  placeholder="例）45"
                  required
                />
              </div>

              <div>
                <label class="text-xs font-medium text-slate-600"
                  >前回実施日</label
                >
                <input
                  id="taskLastDone"
                  type="date"
                  class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                  required
                />
              </div>
            </div>

            <div>
              <label class="text-xs font-medium text-slate-600"
                >メモ（任意）</label
              >
              <textarea
                id="taskNote"
                rows="2"
                class="mt-1 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                placeholder="例）換気扇を回してから。"
                maxlength="160"
              ></textarea>
              <p class="mt-1 text-[11px] text-slate-400">
                ※ この端末内にだけ保存されます
              </p>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
              <button
                id="btnDelete"
                type="button"
                class="hidden rounded-xl border border-red-200 bg-white px-3 py-2 text-sm font-medium text-red-600 hover:bg-red-50"
              >
                削除
              </button>

              <div class="ml-auto flex items-center gap-2">
                <button
                  id="btnCancel"
                  type="button"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-2 text-sm font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
                >
                  保存
                </button>
              </div>
            </div>
          </form>
        </div>

        <p class="mt-3 text-center text-xs text-white/80">
          ヒント：「やった！」で更新
        </p>
      </div>
    </div>

    <!-- Theme Modal -->
    <div id="themeBackdrop" class="fixed inset-0 z-20 hidden bg-black/40 p-4">
      <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-2xl bg-white shadow-xl ring-1 ring-slate-200">
          <div
            class="flex items-center justify-between border-b border-slate-200 px-4 py-3"
          >
            <h3
              id="themeModalTitle"
              class="text-sm font-semibold text-slate-800"
            >
              プロジェクト
            </h3>
            <button
              id="btnCloseThemeModal"
              class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:bg-slate-100"
            >
              ✕
            </button>
          </div>

          <form id="themeForm" class="space-y-4 p-4">
            <input type="hidden" id="themeId" />

            <div>
              <label class="text-xs font-medium text-slate-600"
                >プロジェクト名</label
              >
              <input
                id="themeTitle"
                type="text"
                class="mt-1 w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                placeholder="例）健康 / 事業 / 学習"
                required
                maxlength="40"
              />
            </div>

            <div>
              <label class="text-xs font-medium text-slate-600">目標</label>
              <textarea
                id="themeObjective"
                rows="3"
                class="mt-1 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                placeholder="例）毎週3回運動して体力を上げる"
                maxlength="240"
                required
              ></textarea>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-2">
                <button
                  id="btnArchiveTheme"
                  type="button"
                  class="hidden rounded-xl border border-slate-200 bg-white p-2 hover:bg-slate-50"
                  aria-label="アーカイブ"
                  title="アーカイブ"
                >
                  <img src="icon-archive.svg" alt="" class="h-4 w-4" />
                </button>
                <button
                  id="btnDeleteTheme"
                  type="button"
                  class="hidden rounded-xl border border-red-200 bg-white p-2 hover:bg-red-50"
                  aria-label="削除"
                  title="削除"
                >
                  <img src="icon-delete.svg" alt="" class="h-4 w-4" />
                </button>
              </div>

              <div class="ml-auto flex items-center gap-2">
                <button
                  id="btnCancelTheme"
                  type="button"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-2 text-sm font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
                >
                  保存
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Milestone Modal -->
    <div id="midBackdrop" class="fixed inset-0 z-20 hidden bg-black/40 p-4">
      <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-2xl bg-white shadow-xl ring-1 ring-slate-200">
          <div
            class="flex items-center justify-between border-b border-slate-200 px-4 py-3"
          >
            <h3 id="midModalTitle" class="text-sm font-semibold text-slate-800">
              マイルストーン編集
            </h3>
            <button
              id="btnCloseMidModal"
              class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:bg-slate-100"
            >
              ✕
            </button>
          </div>

          <form id="midForm" class="space-y-4 p-4">
            <input type="hidden" id="midThemeId" />
            <input type="hidden" id="midId" />

            <div>
              <label class="text-xs font-medium text-slate-600"
                >マイルストーン</label
              >
              <textarea
                id="midText"
                rows="3"
                class="mt-1 w-full resize-none rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                maxlength="160"
                required
              ></textarea>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
              <div class="flex items-center gap-2">
                <button
                  id="btnArchiveMid"
                  type="button"
                  class="rounded-xl border border-slate-200 bg-white p-2 hover:bg-slate-50"
                  aria-label="アーカイブ"
                  title="アーカイブ"
                >
                  <img src="icon-archive.svg" alt="" class="h-4 w-4" />
                </button>
                <button
                  id="btnDeleteMid"
                  type="button"
                  class="rounded-xl border border-red-200 bg-white p-2 hover:bg-red-50"
                  aria-label="削除"
                  title="削除"
                >
                  <img src="icon-delete.svg" alt="" class="h-4 w-4" />
                </button>
              </div>

              <div class="ml-auto flex items-center gap-2">
                <button
                  id="btnCancelMid"
                  type="button"
                  class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
                >
                  キャンセル
                </button>
                <button
                  type="submit"
                  class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-2 text-sm font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
                >
                  保存
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Month Detail Modal -->
    <div id="monthBackdrop" class="fixed inset-0 z-20 hidden bg-black/40 p-4">
      <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-2xl bg-white shadow-xl ring-1 ring-slate-200">
          <div
            class="flex items-center justify-between border-b border-slate-200 px-4 py-3"
          >
            <h3
              id="monthModalTitle"
              class="text-sm font-semibold text-slate-800"
            >
              月次記録
            </h3>
            <button
              id="btnCloseMonthModal"
              class="rounded-xl px-3 py-2 text-sm text-slate-500 hover:bg-slate-100"
            >
              ✕
            </button>
          </div>

          <div
            id="monthModalBody"
            class="space-y-3 p-4 text-sm max-h-[65vh] overflow-y-auto"
          ></div>
        </div>
      </div>
    </div>

    <!-- Month Switch Modal -->
    <div
      id="monthSwitchBackdrop"
      class="fixed inset-0 z-20 hidden bg-black/40 p-4"
    >
      <div class="mx-auto mt-10 max-w-md">
        <div class="rounded-2xl bg-white shadow-xl ring-1 ring-slate-200">
          <div
            class="flex items-center justify-between border-b border-slate-200 px-4 py-3"
          >
            <h3 class="text-sm font-semibold text-slate-800">
              月が変わりました
            </h3>
          </div>
          <div class="space-y-3 p-4 text-sm text-slate-700">
            <p>今月に進めますか？</p>
            <p class="text-xs text-slate-500">
              「先月のまま」を選ぶと、この月で進捗を続けられます。リロード時に再度確認します。
            </p>
            <div class="mt-4 flex items-center justify-end gap-2">
              <button
                id="btnKeepMonth"
                type="button"
                class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"
              >
                先月のまま
              </button>
              <button
                id="btnAdvanceMonth"
                type="button"
                class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-4 py-2 text-sm font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
              >
                今月に進む
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // ===== Storage =====
      const STORAGE_KEY = "bokabikun.tasks.v1";
      const THEMES_KEY = "bokabikun.themes.v1";
      const ACTIVE_MONTH_KEY = "bokabikun.activeMonth";

      /** @typedef {{id:string,name:string,intervalDays:number,lastDone:string,note?:string,createdAt:string,updatedAt:string}} Task */
      /** @typedef {{id:string,text:string,progressByMonth:Record<string,number>,createdAt:string,archivedAt?:string}} MidTodo */
      /** @typedef {{id:string,title:string,objective:string,midTodos:MidTodo[],createdAt:string,updatedAt:string,archivedAt?:string}} Theme */

      /** @returns {Task[]} */
      function loadTasks() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try {
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];
          return data;
        } catch {
          return [];
        }
      }

      /** @returns {Theme[]} */
      function loadThemes() {
        const raw = localStorage.getItem(THEMES_KEY);
        if (!raw) return [];
        try {
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];
          return data;
        } catch {
          return [];
        }
      }

      /** @param {Task[]} tasks */
      function saveTasks(tasks) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        localStorage.setItem("bokabikun.updatedAt", new Date().toISOString());
      }

      /** @param {Theme[]} themes */
      function saveThemes(themes) {
        localStorage.setItem(THEMES_KEY, JSON.stringify(themes));
      }

      function nowISODate() {
        // local date -> YYYY-MM-DD
        const d = new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${y}-${m}-${day}`;
      }

      function daysBetween(fromISO, toISO) {
        const from = new Date(fromISO + "T00:00:00");
        const to = new Date(toISO + "T00:00:00");
        const ms = to - from;
        return Math.floor(ms / (1000 * 60 * 60 * 24));
      }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function monthKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        return `${y}-${m}`;
      }

      function recentMonthKeys(count, baseKey) {
        const months = [];
        const base = baseKey ? new Date(`${baseKey}-01T00:00:00`) : new Date();
        for (let i = 0; i < count; i++) {
          const current = new Date(base.getFullYear(), base.getMonth() - i, 1);
          months.push(monthKey(current));
        }
        return months;
      }

      function initActiveMonth() {
        const current = monthKey();
        const stored = localStorage.getItem(ACTIVE_MONTH_KEY);
        if (!stored) {
          localStorage.setItem(ACTIVE_MONTH_KEY, current);
          activeMonthKey = current;
          return;
        }
        if (stored !== current && !monthSwitchShown) {
          monthSwitchShown = true;
          monthSwitchBackdrop.classList.remove("hidden");
          document.body.classList.add("overflow-hidden");
          return;
        }
        activeMonthKey = stored;
      }

      function uid() {
        // good enough for local
        return (
          Math.random().toString(16).slice(2) + "-" + Date.now().toString(16)
        );
      }

      // ===== UI =====
      const elList = document.getElementById("list");
      const elEmpty = document.getElementById("emptyState");
      const elCountText = document.getElementById("countText");
      const elUpdatedText = document.getElementById("updatedText");

      const elThemeList = document.getElementById("themeList");
      const elThemeEmpty = document.getElementById("themeEmptyState");
      const elThemeCountText = document.getElementById("themeCountText");

      const tabViewport = document.getElementById("tabViewport");
      const elBody = document.body;
      const tabButtons = [...document.querySelectorAll(".tab-btn")];
      const tasksPanel = document.getElementById("tasksPanel");
      const themesPanel = document.getElementById("themesPanel");

      const btnAddFab = document.getElementById("btnAddFab");
      const btnAddThemeInline = document.getElementById("btnAddThemeInline");

      const toast = document.getElementById("toast");
      const toastMessage = document.getElementById("toastMessage");
      const btnUndo = document.getElementById("btnUndo");

      const backdrop = document.getElementById("modalBackdrop");
      const btnCloseModal = document.getElementById("btnCloseModal");
      const btnCancel = document.getElementById("btnCancel");
      const btnDelete = document.getElementById("btnDelete");
      const modalTitle = document.getElementById("modalTitle");

      const form = document.getElementById("taskForm");
      const inputId = document.getElementById("taskId");
      const inputName = document.getElementById("taskName");
      const inputInterval = document.getElementById("taskInterval");
      const inputLastDone = document.getElementById("taskLastDone");
      const inputNote = document.getElementById("taskNote");

      const themeBackdrop = document.getElementById("themeBackdrop");
      const themeModalTitle = document.getElementById("themeModalTitle");
      const btnCloseThemeModal = document.getElementById("btnCloseThemeModal");
      const btnCancelTheme = document.getElementById("btnCancelTheme");
      const btnArchiveTheme = document.getElementById("btnArchiveTheme");
      const btnDeleteTheme = document.getElementById("btnDeleteTheme");
      const themeForm = document.getElementById("themeForm");
      const themeId = document.getElementById("themeId");
      const themeTitle = document.getElementById("themeTitle");
      const themeObjective = document.getElementById("themeObjective");

      const midBackdrop = document.getElementById("midBackdrop");
      const btnCloseMidModal = document.getElementById("btnCloseMidModal");
      const btnCancelMid = document.getElementById("btnCancelMid");
      const btnArchiveMid = document.getElementById("btnArchiveMid");
      const btnDeleteMid = document.getElementById("btnDeleteMid");

      const midThemeId = document.getElementById("midThemeId");
      const midId = document.getElementById("midId");
      const midText = document.getElementById("midText");

      const btnCloseMonthModal = document.getElementById("btnCloseMonthModal");
      const monthModalTitle = document.getElementById("monthModalTitle");
      const monthModalBody = document.getElementById("monthModalBody");

      const monthSwitchBackdrop = document.getElementById(
        "monthSwitchBackdrop"
      );
      const btnKeepMonth = document.getElementById("btnKeepMonth");
      const btnAdvanceMonth = document.getElementById("btnAdvanceMonth");

      /** @type {Task[]} */
      let tasks = loadTasks();
      /** @type {Theme[]} */
      let themes = loadThemes();
      let lastAction = null;
      let toastTimer = null;
      let currentTab = "tasks";
      const openHistory = new Set();
      let activeMonthKey = null;
      let monthSwitchShown = false;

      function formatUpdatedAt() {
        const raw = localStorage.getItem("bokabikun.updatedAt");
        if (!raw) return "更新: —";
        const d = new Date(raw);
        if (Number.isNaN(d.getTime())) return "更新: —";
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        return `更新: ${y}-${m}-${day} ${hh}:${mm}`;
      }

      function statusBadge(elapsed, interval) {
        // - due: 経過 >= interval
        // - soon: 経過 >= 0.75*interval
        if (elapsed >= interval) {
          return {
            label: "やっとく？",
            cls: "bg-rose-50 text-rose-700 ring-1 ring-rose-200",
          };
        }
        if (elapsed >= Math.floor(interval * 0.75)) {
          return {
            label: "そろそろやで",
            cls: "bg-amber-50 text-amber-700 ring-1 ring-amber-200",
          };
        }
        return null;
      }

      function render() {
        tasks = loadTasks();

        // sort: smaller remaining percent first; overdue prioritized
        const today = nowISODate();
        const sorted = [...tasks].sort((a, b) => {
          const ea = daysBetween(a.lastDone, today);
          const eb = daysBetween(b.lastDone, today);
          // Remaining % = (remaining days / interval days) * 100; guard zero interval.
          const pa =
            a.intervalDays > 0
              ? ((a.intervalDays - ea) / a.intervalDays) * 100
              : -Infinity;
          const pb =
            b.intervalDays > 0
              ? ((b.intervalDays - eb) / b.intervalDays) * 100
              : -Infinity;
          // Same %: fall back to remaining days for stable ordering.
          if (pa !== pb) return pa - pb;
          const ra = a.intervalDays - ea;
          const rb = b.intervalDays - eb;
          return ra - rb;
        });

        elList.innerHTML = "";
        elCountText.textContent = `${sorted.length}件`;
        elUpdatedText.textContent = formatUpdatedAt();

        if (sorted.length === 0) {
          elEmpty.classList.remove("hidden");
        } else {
          elEmpty.classList.add("hidden");
        }

        for (const t of sorted) {
          const elapsed = clamp(daysBetween(t.lastDone, today), 0, 99999);
          const remain = t.intervalDays - elapsed;
          const ratio = Math.round((elapsed / t.intervalDays) * 100);

          const badge = statusBadge(elapsed, t.intervalDays);
          const badgeHtml = badge
            ? `<span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-medium ${badge.cls}">
                ${badge.label}
              </span>`
            : "";

          const card = document.createElement("div");
          card.dataset.taskId = t.id;
          card.className =
            "cursor-pointer rounded-2xl border border-slate-200 bg-white p-4 shadow-sm hover:shadow transition-shadow";

          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <div class="flex items-center gap-2">
                  <h3 class="truncate text-base font-semibold text-slate-900">${escapeHtml(
                    t.name
                  )}</h3>
                  ${badgeHtml}
                </div>
                <p class="mt-1 text-xs text-slate-500">
                  前回: <span class="font-medium text-slate-700">${
                    t.lastDone
                  }</span>
                  ・ 周期: <span class="font-medium text-slate-700">${
                    t.intervalDays
                  }日</span>
                </p>
                ${
                  t.note
                    ? `<p class="mt-2 line-clamp-2 text-sm text-slate-700">${escapeHtml(
                        t.note
                      )}</p>`
                    : ""
                }
              </div>

              <div class="flex shrink-0 flex-col items-end gap-2">
                <button
                  data-action="done"
                  data-id="${t.id}"
                  class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-3 py-2 text-sm font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
                  title="前回実施日を今日に更新"
                >
                  やった！
                </button>
              </div>
            </div>

            <div class="mt-3">
              <div class="flex items-center justify-between text-[11px] text-slate-500">
                <span>${
                  remain >= 0
                    ? `あと ${remain}日`
                    : `超過 ${Math.abs(remain)}日`
                }</span>
                <span>${clamp(ratio, 0, 999)}%</span>
              </div>
              <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                <div class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-sky-400" style="width:${clamp(
                  ratio,
                  0,
                  100
                )}%"></div>
              </div>
            </div>
          `;

          elList.appendChild(card);
        }
      }

      function renderThemes() {
        themes = loadThemes();
        const currentMonth = activeMonthKey || monthKey();
        const monthKeys = recentMonthKeys(12, currentMonth);

        elThemeList.innerHTML = "";
        elThemeCountText.textContent = `${themes.length}件`;
        if (themes.length === 0) {
          elThemeEmpty.classList.remove("hidden");
        } else {
          elThemeEmpty.classList.add("hidden");
        }

        for (const theme of themes) {
          const activeTodos = theme.midTodos.filter((m) => !m.archivedAt);
          const historyOpen = openHistory.has(theme.id);
          const allTodos = theme.midTodos;
          let sumCurrent = 0;
          let countCurrent = 0;
          for (const m of allTodos) {
            const value = m.progressByMonth?.[currentMonth];
            if (typeof value !== "number") continue;
            sumCurrent += value;
            countCurrent += 1;
          }

            countCurrent > 0 ? Math.round(sumCurrent / countCurrent) : 0;

          const card = document.createElement("div");
          card.className =
            "rounded-2xl border border-slate-200 bg-white p-4 shadow-sm";
          card.dataset.role = "theme-card";
          card.dataset.themeId = theme.id;

          const activeHtml =
            activeTodos.length === 0
              ? `<p class="text-xs text-slate-400">マイルストーンなし</p>`
              : activeTodos
                  .map((m) => {
                    const progress = clamp(
                      m.progressByMonth?.[currentMonth] || 0,
                      0,
                      100
                    );
                    return `
                      <div class="rounded-xl border border-slate-200 bg-slate-50 p-2" data-role="midtodo-card" data-theme-id="${theme.id}" data-mid-id="${m.id}">
                        <div class="flex items-start justify-between gap-2">
                          <button
                            data-action="open-midtodo"
                            data-theme-id="${theme.id}"
                            data-mid-id="${m.id}"
                            class="flex-1 text-left"
                          >
                            <p class="text-[13px] text-slate-800 whitespace-pre-wrap break-words leading-snug">${formatMultiline(
                              m.text
                            )}</p>
                          </button>
                          <div class="flex items-center gap-2 text-[11px] text-slate-500">
                            <span>${progress}%</span>
                            <div class="flex items-center gap-1">
                              <button
                                data-action="decrement-midtodo"
                                data-theme-id="${theme.id}"
                                data-mid-id="${m.id}"
                                class="icon-press p-0"
                                aria-label="進捗を減らす"
                              >
                                <span class="icon-swap" data-role="icon-swap">
                                  <img
                                    src="icon-button.svg"
                                    alt=""
                                    class="icon-base"
                                    style="transform: scaleY(-1);"
                                  />
                                  <img
                                    src="icon-button-active.svg"
                                    alt=""
                                    class="icon-active"
                                    style="transform: scaleY(-1);"
                                  />
                                </span>
                              </button>
                              <button
                                data-action="increment-midtodo"
                                data-theme-id="${theme.id}"
                                data-mid-id="${m.id}"
                                class="icon-press p-0"
                                aria-label="進捗を増やす"
                              >
                                <span class="icon-swap" data-role="icon-swap">
                                  <img src="icon-button.svg" alt="" class="icon-base" />
                                  <img
                                    src="icon-button-active.svg"
                                    alt=""
                                    class="icon-active"
                                  />
                                </span>
                              </button>
                            </div>
                          </div>
                        </div>
                        <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                          <div class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-sky-400" style="width:${progress}%"></div>
                        </div>
                      </div>
                    `;
                  })
                  .join("");

          const historyHtml = monthKeys
            .map((key) => {
              let sum = 0;
              let count = 0;
              for (const m of allTodos) {
                const value = m.progressByMonth?.[key];
                if (typeof value !== "number") continue;
                sum += value;
                count += 1;

              const avg = count > 0 ? Math.round(sum / count) : null;
              return `
                <button
                  data-action="open-month"
                  data-theme-id="${theme.id}"
                  data-month="${key}"
                  class="rounded-lg border border-slate-200 bg-white px-2 py-2 text-center hover:bg-slate-50"
                >
                  <div class="text-[11px] text-slate-500">${key}</div>
                  <div class="mt-1 text-sm font-semibold text-slate-800">${
                    avg === null ? "—" : `${avg}%`
                  }</div>
                </button>
              `;
            })
            .join("");

          card.innerHTML = `
            <div
              class="flex w-full items-start justify-between gap-3 cursor-pointer"
              data-action="edit-theme"
              data-id="${theme.id}"
              role="button"
              tabindex="0"
            >
              <div class="min-w-0 w-full">
                <h3 class="text-base font-semibold text-slate-900 whitespace-pre-wrap break-words">${formatMultiline(
                  theme.title
                )}</h3>
                <p class="mt-2 text-sm text-slate-700 whitespace-pre-wrap break-words">${formatMultiline(
                  theme.objective
                )}</p>
                ${
                  theme.archivedAt
                    ? `<span class="mt-2 inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600">アーカイブ</span>`
                    : ""
                }
                <div class="mt-3">
                  <div class="flex items-center justify-between text-[11px] text-slate-500">
                    <span>今月の進捗</span>
                    <span>${clamp(avgCurrent, 0, 100)}%</span>
                  </div>
                  <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                    <div class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-sky-400" style="width:${clamp(
                      avgCurrent,
                      0,
                      100
                    )}%"></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="mt-4">
              <p class="text-xs font-semibold text-slate-500">アクション</p>
              <div class="mt-2 grid gap-2" data-role="midtodo-list" data-theme-id="${theme.id}">
                ${activeHtml}
              </div>
              <div class="mt-3 flex items-center gap-2">
                <input
                  data-role="midtodo-input"
                  data-theme-id="${theme.id}"
                  type="text"
                  class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400"
                  placeholder="マイルストーンを追加"
                  maxlength="120"
                />
                <button
                  data-action="add-midtodo"
                  data-id="${theme.id}"
                  class="rounded-xl bg-gradient-to-r from-emerald-400 to-sky-400 px-3 py-2 text-xs font-medium text-white shadow-sm hover:from-emerald-500 hover:to-sky-500 active:from-emerald-600 active:to-sky-600"
                  aria-label="マイルストーンを追加"
                >
                  ＋
                </button>
              </div>
            </div>

            <div class="mt-5">
              <div class="flex items-center justify-between">

                <button
                  data-action="toggle-history"
                  data-id="${theme.id}"
                  class="rounded-lg border border-slate-200 bg-white px-2 py-1 text-[11px] text-slate-600 hover:bg-slate-100"
                >
                  ${historyOpen ? "閉じる" : "開く"}
                </button>
              </div>
              <div class="mt-2 grid grid-cols-3 gap-2 ${
                historyOpen ? "" : "hidden"
              }" data-role="history-panel" data-theme-id="${theme.id}">
                ${historyHtml}
              </div>
            </div>
          `;

          elThemeList.appendChild(card);
        }
      }

      const DRAG_HOLD_MS = 380;
      const DRAG_MOVE_TOLERANCE = 6;
      let dragTimer = null;
      let dragCandidate = null;
      let dragState = null;
      let dragJustEnded = false;

      function clearDragTimer() {
        if (dragTimer) {
          clearTimeout(dragTimer);
          dragTimer = null;
        }
      }

      function isInteractiveTarget(target) {
        const button = target.closest("button");
        if (button) {
          const action = button.getAttribute("data-action");
          if (action === "open-midtodo") return false;
          return true;
        }
        return Boolean(target.closest("input, textarea, select, label"));
      }

      function startDrag() {
        if (!dragCandidate) return;
        const { card, type, themeId, pointerId } = dragCandidate;
        const listEl =
          type === "theme"
            ? elThemeList
            : card.closest('[data-role="midtodo-list"]');
        if (!listEl) {
          dragCandidate = null;
          return;
        }
        dragState = {
          card,
          type,
          themeId,
          listEl,
          pointerId,
        };
        dragCandidate = null;
        card.classList.add("dragging-item");
        document.body.classList.add("drag-mode");
        try {
          card.setPointerCapture(pointerId);
        } catch {
          // ignore capture errors
        }
      }

      function finishDrag() {
        if (!dragState) return;
        const { card, type, themeId, listEl, pointerId } = dragState;
        card.classList.remove("dragging-item");
        document.body.classList.remove("drag-mode");
        try {
          card.releasePointerCapture(pointerId);
        } catch {
          // ignore release errors
        }
        if (type === "theme") {
          const ids = [...listEl.querySelectorAll('[data-role="theme-card"]')]
            .map((el) => el.getAttribute("data-theme-id"))
            .filter(Boolean);
          const all = loadThemes();
          const map = new Map(all.map((t) => [t.id, t]));
          const idSet = new Set(ids);
          const ordered = ids.map((id) => map.get(id)).filter(Boolean);
          const remaining = all.filter((t) => !idSet.has(t.id));
          saveThemes([...ordered, ...remaining]);
        } else if (type === "midtodo" && themeId) {
          const list = elThemeList.querySelector(
            `[data-role="midtodo-list"][data-theme-id="${themeId}"]`
          );
          const all = loadThemes();
          const theme = all.find((t) => t.id === themeId);
          if (list && theme) {
            const activeIds = [
              ...list.querySelectorAll('[data-role="midtodo-card"]'),
            ]
              .map((el) => el.getAttribute("data-mid-id"))
              .filter(Boolean);
            const activeMap = new Map(
              theme.midTodos
                .filter((m) => !m.archivedAt)
                .map((m) => [m.id, m])
            );
            const reorderedActive = activeIds
              .map((id) => activeMap.get(id))
              .filter(Boolean);
            const archived = theme.midTodos.filter((m) => m.archivedAt);
            theme.midTodos = [...reorderedActive, ...archived];
            theme.updatedAt = new Date().toISOString();
            saveThemes(all);
          }
        }
        dragState = null;
        dragJustEnded = true;
        setTimeout(() => {
          dragJustEnded = false;
        }, 200);
        renderThemes();
      }

      function cancelPendingDrag() {
        dragCandidate = null;
        clearDragTimer();
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatMultiline(s) {
        return escapeHtml(s).replaceAll("\n", "<br>");
      }

      const iconFlashTimers = new WeakMap();

      function flashIcon(wrapper) {
        if (!wrapper) return;
        wrapper.classList.add("flash");
        const existing = iconFlashTimers.get(wrapper);
        if (existing) clearTimeout(existing);
        const timer = setTimeout(() => {
          wrapper.classList.remove("flash");
        }, 500);
        iconFlashTimers.set(wrapper, timer);
      }

      function openModal(mode, task) {
        backdrop.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");

        if (mode === "create") {
          modalTitle.textContent = "タスク追加";
          btnDelete.classList.add("hidden");
          inputId.value = "";
          inputName.value = "";
          inputInterval.value = "45";
          inputLastDone.value = nowISODate();
          inputNote.value = "";
          inputName.focus();
          return;
        }

        modalTitle.textContent = "タスク編集";
        btnDelete.classList.remove("hidden");
        inputId.value = task.id;
        inputName.value = task.name;
        inputInterval.value = String(task.intervalDays);
        inputLastDone.value = task.lastDone;
        inputNote.value = task.note || "";
        inputName.focus();
      }

      function closeModal() {
        backdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      function showToast(message, canUndo) {
        toastMessage.textContent = message;
        if (canUndo) {
          btnUndo.classList.remove("hidden");
        } else {
          btnUndo.classList.add("hidden");
        }
        toast.classList.remove("hidden");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add("hidden");
        }, 5000);
      }

      function upsertTask(task) {
        const all = loadTasks();
        const idx = all.findIndex((t) => t.id === task.id);
        if (idx >= 0) {
          all[idx] = task;
        } else {
          all.push(task);
        }
        saveTasks(all);
      }

      function deleteTask(id) {
        const all = loadTasks().filter((t) => t.id !== id);
        saveTasks(all);
      }

      function findTask(id) {
        return loadTasks().find((t) => t.id === id);
      }

      function findTheme(id) {
        return loadThemes().find((t) => t.id === id);
      }

      function upsertTheme(theme) {
        const all = loadThemes();
        const idx = all.findIndex((t) => t.id === theme.id);
        if (idx >= 0) {
          all[idx] = theme;
        } else {
          all.push(theme);
        }
        saveThemes(all);
      }

      function deleteTheme(id) {
        const all = loadThemes().filter((t) => t.id !== id);
        saveThemes(all);
      }

      function archiveTheme(id) {
        const all = loadThemes();
        const theme = all.find((t) => t.id === id);
        if (!theme) return;
        theme.archivedAt = new Date().toISOString();
        theme.updatedAt = new Date().toISOString();
        saveThemes(all);
      }

      function openThemeModal(mode, theme) {
        themeBackdrop.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");

        if (mode === "create") {
          themeModalTitle.textContent = "プロジェクト追加";
          btnArchiveTheme.classList.add("hidden");
          btnDeleteTheme.classList.add("hidden");
          themeId.value = "";
          themeTitle.value = "";
          themeObjective.value = "";
          themeTitle.focus();
          return;
        }

        themeModalTitle.textContent = "プロジェクト編集";
        btnArchiveTheme.classList.remove("hidden");
        btnDeleteTheme.classList.remove("hidden");
        themeId.value = theme.id;
        themeTitle.value = theme.title;
        themeObjective.value = theme.objective;
        themeTitle.focus();
      }

      function closeThemeModal() {
        themeBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      function openMidModal(themeIdValue, midIdValue) {
        const theme = findTheme(themeIdValue);
        const mid = theme?.midTodos.find((m) => m.id === midIdValue);
        if (!theme || !mid) return;
        midBackdrop.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
        midThemeId.value = theme.id;
        midId.value = mid.id;
        midText.value = mid.text;
        midText.focus();
      }

      function closeMidModal() {
        midBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      function openMonthModal(themeIdValue, monthKeyValue) {
        const theme = findTheme(themeIdValue);
        if (!theme) return;
        monthModalTitle.textContent = `月次記録 (${monthKeyValue})`;
        const items = theme.midTodos.map((m) => {
          const value = m.progressByMonth?.[monthKeyValue];
          const pct = typeof value === "number" ? clamp(value, 0, 100) : null;
          return `
            <div class="rounded-xl border border-slate-200 bg-slate-50 p-3">
              <p class="text-sm text-slate-800 whitespace-pre-wrap break-words">${formatMultiline(
                m.text
              )}</p>
              ${
                m.archivedAt
                  ? `<span class="mt-2 inline-flex items-center rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-medium text-slate-600">アーカイブ</span>`
                  : ""
              }
              <div class="mt-2">
                <div class="flex items-center justify-between text-[11px] text-slate-500">
                  <span>進捗</span>
                  <span>${pct === null ? "—" : `${pct}%`}</span>
                </div>
                <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                  <div class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-sky-400" style="width:${
                    pct === null ? 0 : pct
                  }%"></div>
                </div>
              </div>
            </div>
          `;
        });
        monthModalBody.innerHTML =
          items.length > 0
            ? items.join("")
            : '<p class="text-xs text-slate-400">マイルストーンなし</p>';
        monthBackdrop.classList.remove("hidden");
        document.body.classList.add("overflow-hidden");
      }

      function closeMonthModal() {
        monthBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
      }

      function addMidTodo(themeIdValue, text) {
        const theme = findTheme(themeIdValue);
        if (!theme) return;
        theme.midTodos.push({
          id: uid(),
          text,
          progressByMonth: {},
          createdAt: new Date().toISOString(),
        });
        theme.updatedAt = new Date().toISOString();
        upsertTheme(theme);
      }

      function archiveMidTodo(themeIdValue, midId) {
        const theme = findTheme(themeIdValue);
        if (!theme) return;
        const mid = theme.midTodos.find((m) => m.id === midId);
        if (!mid || mid.archivedAt) return;
        mid.archivedAt = new Date().toISOString();
        theme.updatedAt = new Date().toISOString();
        upsertTheme(theme);
      }

      function deleteMidTodo(themeIdValue, midId) {
        const theme = findTheme(themeIdValue);
        if (!theme) return;
        theme.midTodos = theme.midTodos.filter((m) => m.id !== midId);
        theme.updatedAt = new Date().toISOString();
        upsertTheme(theme);
      }

      function bumpMidTodoProgress(themeIdValue, midId, delta) {
        const theme = findTheme(themeIdValue);
        if (!theme) return;
        const mid = theme.midTodos.find((m) => m.id === midId);
        if (!mid || mid.archivedAt) return;
        const key = activeMonthKey || monthKey();
        const current = clamp(mid.progressByMonth?.[key] || 0, 0, 100);
        mid.progressByMonth = mid.progressByMonth || {};
        mid.progressByMonth[key] = clamp(current + delta, 0, 100);
        theme.updatedAt = new Date().toISOString();
        upsertTheme(theme);
      }

      function setTab(tab) {
        currentTab = tab;
        const isThemes = tab === "themes";
        tasksPanel.classList.toggle("hidden", isThemes);
        themesPanel.classList.toggle("hidden", !isThemes);
        tabButtons.forEach((btn) => {
          const selected = btn.getAttribute("data-tab") === tab;
          btn.setAttribute("aria-selected", selected ? "true" : "false");
          btn.classList.toggle("bg-white", selected);
          btn.classList.toggle("text-slate-900", selected);
          btn.classList.toggle("text-slate-700", !selected);
        });
        btnAddFab.textContent = "＋ 追加";
        btnAddFab.setAttribute("aria-label", "タスクを追加");
        btnAddFab.classList.toggle("hidden", isThemes);
      }

      // ===== Events =====
      btnAddFab.addEventListener("click", () => openModal("create"));
      btnAddThemeInline.addEventListener("click", () =>
        openThemeModal("create")
      );

      tabButtons.forEach((btn) => {
        btn.addEventListener("click", () =>
          setTab(btn.getAttribute("data-tab"))
        );
      });

      let swipeStartX = null;
      let swipeStartY = null;
      function isModalOpen() {
        return (
          !backdrop.classList.contains("hidden") ||
          !themeBackdrop.classList.contains("hidden") ||
          !midBackdrop.classList.contains("hidden") ||
          !monthBackdrop.classList.contains("hidden") ||
          !monthSwitchBackdrop.classList.contains("hidden")
        );
      }
      function handleSwipeStart(e) {
        swipeStartX = e.touches[0].clientX;
        swipeStartY = e.touches[0].clientY;
      }
      function handleSwipeEnd(e) {
        if (swipeStartX === null || swipeStartY === null) return;
        if (isModalOpen()) {
          swipeStartX = null;
          swipeStartY = null;
          return;
        }
        const endX = e.changedTouches[0].clientX;
        const endY = e.changedTouches[0].clientY;
        const deltaX = endX - swipeStartX;
        const deltaY = endY - swipeStartY;
        swipeStartX = null;
        swipeStartY = null;
        if (Math.abs(deltaX) < 60) return;
        if (Math.abs(deltaY) > Math.abs(deltaX)) return;
        if (deltaX < 0) {
          setTab("themes");
        } else {
          setTab("tasks");
        }
      }
      tabViewport.addEventListener("touchstart", handleSwipeStart, {
        passive: true,
      });
      tabViewport.addEventListener("touchend", handleSwipeEnd);
      elBody.addEventListener("touchstart", handleSwipeStart, {
        passive: true,
      });
      elBody.addEventListener("touchend", handleSwipeEnd);

      btnCloseModal.addEventListener("click", closeModal);
      btnCancel.addEventListener("click", closeModal);
      btnCloseThemeModal.addEventListener("click", closeThemeModal);
      btnCancelTheme.addEventListener("click", closeThemeModal);
      btnCloseMidModal.addEventListener("click", closeMidModal);
      btnCancelMid.addEventListener("click", closeMidModal);
      btnCloseMonthModal.addEventListener("click", closeMonthModal);
      btnKeepMonth.addEventListener("click", () => {
        const stored = localStorage.getItem(ACTIVE_MONTH_KEY);
        activeMonthKey = stored || monthKey();
        monthSwitchBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        renderThemes();
      });
      btnAdvanceMonth.addEventListener("click", () => {
        const current = monthKey();
        localStorage.setItem(ACTIVE_MONTH_KEY, current);
        activeMonthKey = current;
        monthSwitchBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        renderThemes();
      });
      document.addEventListener("click", (e) => {
        if (toast.classList.contains("hidden")) return;
        if (e.target.closest('[data-action="done"]')) return;
        if (toast.contains(e.target)) return;
        toast.classList.add("hidden");
        if (toastTimer) clearTimeout(toastTimer);
      });
      btnUndo.addEventListener("click", () => {
        if (!lastAction) return;
        const t = findTask(lastAction.id);
        if (!t) return;
        t.lastDone = lastAction.lastDone;
        t.updatedAt = lastAction.updatedAt;
        upsertTask(t);
        lastAction = null;
        toast.classList.add("hidden");
        render();
      });

      backdrop.addEventListener("click", (e) => {
        if (e.target === backdrop) closeModal();
      });
      themeBackdrop.addEventListener("click", (e) => {
        if (e.target === themeBackdrop) closeThemeModal();
      });
      midBackdrop.addEventListener("click", (e) => {
        if (e.target === midBackdrop) closeMidModal();
      });
      monthBackdrop.addEventListener("click", (e) => {
        if (e.target === monthBackdrop) closeMonthModal();
      });
      monthSwitchBackdrop.addEventListener("click", (e) => {
        if (e.target !== monthSwitchBackdrop) return;
        const stored = localStorage.getItem(ACTIVE_MONTH_KEY);
        activeMonthKey = stored || monthKey();
        monthSwitchBackdrop.classList.add("hidden");
        document.body.classList.remove("overflow-hidden");
        renderThemes();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key !== "Escape") return;
        if (!backdrop.classList.contains("hidden")) closeModal();
        if (!themeBackdrop.classList.contains("hidden")) closeThemeModal();
        if (!midBackdrop.classList.contains("hidden")) closeMidModal();
        if (!monthBackdrop.classList.contains("hidden")) closeMonthModal();
        if (!monthSwitchBackdrop.classList.contains("hidden")) {
          const stored = localStorage.getItem(ACTIVE_MONTH_KEY);
          activeMonthKey = stored || monthKey();
          monthSwitchBackdrop.classList.add("hidden");
          document.body.classList.remove("overflow-hidden");
          renderThemes();
        }
      });

      btnDelete.addEventListener("click", () => {
        const id = inputId.value;
        if (!id) return;
        // ゆるいアプリなので confirm だけ
        if (confirm("このタスクを削除しますか？")) {
          deleteTask(id);
          closeModal();
          render();
        }
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        const id = inputId.value || uid();
        const name = inputName.value.trim();
        const intervalDays = Number(inputInterval.value);
        const lastDone = inputLastDone.value;
        const note = inputNote.value.trim();

        if (!name) return;
        if (!Number.isFinite(intervalDays) || intervalDays < 1) return;
        if (!lastDone) return;

        const existing = findTask(id);
        const createdAt = existing?.createdAt || new Date().toISOString();

        /** @type {Task} */
        const task = {
          id,
          name,
          intervalDays,
          lastDone,
          note: note || "",
          createdAt,
          updatedAt: new Date().toISOString(),
        };

        upsertTask(task);
        closeModal();
        render();
      });

      btnDeleteTheme.addEventListener("click", () => {
        const id = themeId.value;
        if (!id) return;
        if (confirm("このプロジェクトを削除しますか？")) {
          deleteTheme(id);
          closeThemeModal();
          renderThemes();
        }
      });

      btnArchiveTheme.addEventListener("click", () => {
        const id = themeId.value;
        if (!id) return;
        if (confirm("このプロジェクトをアーカイブしますか？")) {
          archiveTheme(id);
          closeThemeModal();
          renderThemes();
        }
      });

      themeForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const id = themeId.value || uid();
        const title = themeTitle.value.trim();
        const objective = themeObjective.value.trim();
        if (!title || !objective) return;

        const existing = findTheme(id);
        const createdAt = existing?.createdAt || new Date().toISOString();
        const midTodos = existing?.midTodos || [];
        const archivedAt = existing?.archivedAt;

        /** @type {Theme} */
        const theme = {
          id,
          title,
          objective,
          midTodos,
          archivedAt,
          createdAt,
          updatedAt: new Date().toISOString(),
        };

        upsertTheme(theme);
        closeThemeModal();
        renderThemes();
      });

      btnArchiveMid.addEventListener("click", () => {
        const themeIdValue = midThemeId.value;
        const midIdValue = midId.value;
        if (!themeIdValue || !midIdValue) return;
        archiveMidTodo(themeIdValue, midIdValue);
        closeMidModal();
        renderThemes();
      });

      btnDeleteMid.addEventListener("click", () => {
        const themeIdValue = midThemeId.value;
        const midIdValue = midId.value;
        if (!themeIdValue || !midIdValue) return;
        if (confirm("このマイルストーンを削除しますか？")) {
          deleteMidTodo(themeIdValue, midIdValue);
          closeMidModal();
          renderThemes();
        }
      });

      midForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const themeIdValue = midThemeId.value;
        const midIdValue = midId.value;
        if (!themeIdValue || !midIdValue) return;
        const theme = findTheme(themeIdValue);
        const mid = theme?.midTodos.find((m) => m.id === midIdValue);
        if (!theme || !mid) return;
        const next = midText.value.trim();
        if (!next) return;
        mid.text = next;
        theme.updatedAt = new Date().toISOString();
        upsertTheme(theme);
        closeMidModal();
        renderThemes();
      });

      elList.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        const action = btn?.getAttribute("data-action");
        const id = btn?.getAttribute("data-id");

        if (action === "done" && id) {
          const t = findTask(id);
          if (!t) return;
          lastAction = {
            id: t.id,
            lastDone: t.lastDone,
            updatedAt: t.updatedAt,
          };
          t.lastDone = nowISODate();
          t.updatedAt = new Date().toISOString();
          upsertTask(t);
          render();
          showToast("🎉 更新したよ", true);
          return;
        }

        const card = e.target.closest("[data-task-id]");
        const cardId = card?.getAttribute("data-task-id");
        if (!cardId) return;
        const t = findTask(cardId);
        if (t) openModal("edit", t);
      });

      elThemeList.addEventListener("click", (e) => {
        if (dragJustEnded) return;
        const btn = e.target.closest("button");
        const action = btn?.getAttribute("data-action");
        const editableCard = e.target.closest('[data-action="edit-theme"]');
        if (!action && editableCard) {
          const id = editableCard.getAttribute("data-id");
          const theme = findTheme(id);
          if (theme) openThemeModal("edit", theme);
          return;
        }
        if (!action) return;

        if (action === "edit-theme") {
          const id = btn.getAttribute("data-id");
          const theme = findTheme(id);
          if (theme) openThemeModal("edit", theme);
          return;
        }

        if (action === "add-midtodo") {
          const id = btn.getAttribute("data-id");
          const input = elThemeList.querySelector(
            `[data-role="midtodo-input"][data-theme-id="${id}"]`
          );
          const text = input?.value.trim() || "";
          if (!id || !text) return;
          addMidTodo(id, text);
          input.value = "";
          renderThemes();
          return;
        }

        if (action === "open-midtodo") {
          const themeIdValue = btn.getAttribute("data-theme-id");
          const midIdValue = btn.getAttribute("data-mid-id");
          if (!themeIdValue || !midIdValue) return;
          openMidModal(themeIdValue, midIdValue);
          return;
        }

        if (action === "increment-midtodo" || action === "decrement-midtodo") {
          const themeIdValue = btn.getAttribute("data-theme-id");
          const midIdValue = btn.getAttribute("data-mid-id");
          if (!themeIdValue || !midIdValue) return;
          const delta = action === "increment-midtodo" ? 5 : -5;
          bumpMidTodoProgress(themeIdValue, midIdValue, delta);
          renderThemes();
          const flashed = elThemeList.querySelector(
            `button[data-action="${action}"][data-theme-id="${themeIdValue}"][data-mid-id="${midIdValue}"] [data-role="icon-swap"]`
          );
          flashIcon(flashed);
          return;
        }

        if (action === "toggle-history") {
          const id = btn.getAttribute("data-id");
          if (!id) return;
          if (openHistory.has(id)) {
            openHistory.delete(id);
          } else {
            openHistory.add(id);
          }
          renderThemes();
          return;
        }

        if (action === "open-month") {
          const themeIdValue = btn.getAttribute("data-theme-id");
          const monthKeyValue = btn.getAttribute("data-month");
          if (!themeIdValue || !monthKeyValue) return;
          openMonthModal(themeIdValue, monthKeyValue);
          return;
        }
      });

      elThemeList.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const editableCard = e.target.closest('[data-action="edit-theme"]');
          if (editableCard) {
            const id = editableCard.getAttribute("data-id");
            const theme = findTheme(id);
            if (theme) openThemeModal("edit", theme);
            return;
          }
        }
        if (e.key !== "Enter") return;
        const input = e.target.closest('[data-role="midtodo-input"]');
        if (!input) return;
        const id = input.getAttribute("data-theme-id");
        const text = input.value.trim();
        if (!id || !text) return;
        addMidTodo(id, text);
        input.value = "";
        renderThemes();
      });

      elThemeList.addEventListener("pointerdown", (e) => {
        if (currentTab !== "themes") return;
        if (e.button && e.button !== 0) return;
        if (isInteractiveTarget(e.target)) return;
        const midCard = e.target.closest('[data-role="midtodo-card"]');
        const themeCard = e.target.closest('[data-role="theme-card"]');
        const card = midCard || themeCard;
        if (!card) return;
        const type = midCard ? "midtodo" : "theme";
        const themeId = card.getAttribute("data-theme-id");
        dragCandidate = {
          card,
          type,
          themeId,
          pointerId: e.pointerId,
          startX: e.clientX,
          startY: e.clientY,
        };
        clearDragTimer();
        dragTimer = setTimeout(() => startDrag(), DRAG_HOLD_MS);
      });

      document.addEventListener(
        "pointermove",
        (e) => {
          if (dragState) {
            const selector =
              dragState.type === "theme"
                ? '[data-role="theme-card"]'
                : '[data-role="midtodo-card"]';
            const target = document.elementFromPoint(e.clientX, e.clientY);
            const overCard = target?.closest(selector);
            if (
              overCard &&
              overCard !== dragState.card &&
              (!dragState.themeId ||
                overCard.getAttribute("data-theme-id") === dragState.themeId)
            ) {
              const rect = overCard.getBoundingClientRect();
              const insertBefore = e.clientY < rect.top + rect.height / 2;
              dragState.listEl.insertBefore(
                dragState.card,
                insertBefore ? overCard : overCard.nextSibling
              );
            }
            e.preventDefault();
            return;
          }
          if (!dragCandidate) return;
          const dx = Math.abs(e.clientX - dragCandidate.startX);
          const dy = Math.abs(e.clientY - dragCandidate.startY);
          if (dx > DRAG_MOVE_TOLERANCE || dy > DRAG_MOVE_TOLERANCE) {
            cancelPendingDrag();
          }
        },
        { passive: false }
      );

      document.addEventListener("pointerup", () => {
        if (dragState) {
          finishDrag();
          return;
        }
        cancelPendingDrag();
      });

      document.addEventListener("pointercancel", () => {
        if (dragState) {
          finishDrag();
          return;
        }
        cancelPendingDrag();
      });

      // Initial render
      if (!localStorage.getItem("bokabikun.updatedAt")) {
        localStorage.setItem("bokabikun.updatedAt", new Date().toISOString());
      }
      if (!localStorage.getItem(STORAGE_KEY)) {
        const today = nowISODate();
        const sample = [
          {
            id: uid(),
            name: "防カビくん",
            intervalDays: 60,
            lastDone: today,
            note: "たまにはやろう",
          },
        ].map((t) => ({
          ...t,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
        }));

        saveTasks(sample);
      }
      if (!localStorage.getItem(THEMES_KEY)) {
        saveThemes([]);
      }
      initActiveMonth();
      render();
      renderThemes();
      setTab("tasks");

      // PWA service worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {
            // ignore registration errors for local file or unsupported environments
          });
        });
      }
    </script>
  </body>
</html>
